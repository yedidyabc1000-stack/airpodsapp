name: Publish AirPause Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-release]')
    name: Build and publish v1.0.7
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests and build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/AirPause-Android4.4.apk
          ls -lh artifacts/AirPause-Android4.4.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          target_commitish: main
          name: AirPause v1.0.7
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            AirPause — אפליקציית Android לזיהוי מצב לבישה של AirPods ולהשהיית/חידוש מוזיקה.

            **תאימות יעד:** Android 4.4 (API 19) ומעלה.

            **קובץ התקנה:** AirPause-Android4.4.apk

            **שיפורים בגרסה זו:** זיהוי BLE ללא המתנה לחיבור A2DP, תמיכה בהודעות proximity גם כאשר מזהה הדגם אינו מוכר, קביעת מצב בסיס מהפרסומת הראשונה ואימות שינוי לבישה בשתי פרסומות רצופות.

            **שיפורים בגרסה זו:** ניטור ושחזור סריקת BLE ישנה עבור Qin S1+ / Android 4.4, מוני אבחון לשידורי BLE/Apple/AirPods, הפחתת עדכוני התראה מיותרים בזמן פרסומות חוזרות.

            **שיפורים בגרסה זו:** פענוח BLE סלחני יותר למיקום/קידומת של הודעת Proximity, הצגת דגימת HEX גולמית של נתוני Apple האחרונים, ובדיקות נוספות לפורמט ההודעות.

            **שיפורים בגרסה זו:** ספירה נפרדת של הודעות Apple Proximity type 0x07, הצגת דגימת HEX ייעודית של הודעות אלו, ובדיקות שמוודאות ש־Nearby Info type 0x10 אינו מזוהה בטעות כ-AirPods.

            **שיפורים בגרסה זו:** אבחון נפרד של פרסומות האוזניות `07 19` ושל הקייס `07 11`, כולל מונים ודגימות HEX עצמאיות, כדי לזהות האם Qin S1+ קולט את שידור האוזניות ולא רק את שידור הקייס.

            **שיפורים בגרסה זו:** הצגת כל בלוק Apple manufacturer עד 31 בתים, הודעת Proximity 07 אחרונה גם אם אינה תואמת בדיוק ל-07 19, עוצמת אות RSSI וכתובת BLE מקוצרת בנפרד להודעות 07 19 ו-07 11 06.

            **שיפורים בגרסה זו:** תיקון false-positive בספירת Proximity: הודעת 07 נספרת רק אם האורך והקידומת תואמים למסגרת מלאה 07 19 01 או 07 11 06. נוסף test לנתוני Apple שבהם מופיע 07 38 באורך בלתי אפשרי.

            **הערה:** זהו APK שנבנה ונחתם במפתח Debug. בדיקות CI עברו, אך הזיהוי הפיזי ופקודות Pause/Play עדיין דורשים אימות על הטלפון והאוזניות בפועל.
          files: artifacts/AirPause-Android4.4.apk
