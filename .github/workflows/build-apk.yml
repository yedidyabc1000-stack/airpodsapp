name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run parser tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/AirPause-Android4.4.apk
          ls -lh artifacts/AirPause-Android4.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPause-Android4.4-APK
          path: artifacts/AirPause-Android4.4.apk
          if-no-files-found: error
          retention-days: 30
